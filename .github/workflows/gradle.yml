name: Kwik tests and release

on:
  push:
    branches: ['maintenance-0.12.1']
    tags: ['v0.12.1-maintenance.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kwik-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Test and build library
        run: bash ./gradlew :kwik:test :kwik:jar :kwik:sourcesJar :kwik:generatePomFileForMavenPublication --no-daemon --stacktrace
      - name: Prepare release files
        run: python tools/prepare_release.py
      - name: Save release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kwik-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tests-${{ matrix.os }}
          path: |
            core/build/reports/tests/
            core/build/test-results/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kwik-ubuntu-latest
          path: dist
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --verify-tag --title "Kwik $RELEASE_TAG" --notes-file RELEASE-NOTES.md --prerelease
